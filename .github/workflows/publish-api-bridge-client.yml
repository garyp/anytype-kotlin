# Publishes :api-bridge-client to this repository's GitHub Packages registry as
# io.anytype.apibridge:api-bridge-client:<version>. Push a tag api-bridge-client-v<version>
# (for example api-bridge-client-v0.1.0) to run it. A version can be published only once.
name: Publish API bridge client
on:
  push:
    tags:
      - 'api-bridge-client-v*'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Write github.properties
        # settings.gradle requires the file. Building the client resolves nothing from the
        # registries it configures, so the workflow's own token is enough.
        run: |
          printf 'gpr.usr=%s\ngpr.key=%s\n' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" > github.properties
      - name: Test and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :api-bridge-client:testDebugUnitTest :api-bridge-client:publish
          -PapiBridgeClientVersion="${GITHUB_REF_NAME#api-bridge-client-v}"
