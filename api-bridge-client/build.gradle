plugins {
    id "com.android.library"
    id "kotlin-android"
    id "maven-publish"
}

android {
    namespace 'io.anytype.apibridge.client'

    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        aidl = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation libs.coroutines
    implementation libs.coroutinesAndroid
    implementation libs.androidxCore

    testImplementation libs.junit
    testImplementation libs.robolectricBridge
    testImplementation libs.androidXTestCore
    testImplementation libs.kotlinTest
}

// The client's version is the app's (app/gradle.properties, as versioning.gradle builds it, without
// the dated variant), so it never needs a bump of its own. -Pversion.versionPostfix=<n> publishes
// a second build of the same app version as <version>-<n>.
def appVersionProps = new Properties()
rootProject.file("app/gradle.properties").withInputStream { appVersionProps.load(it) }
def apiBridgeClientVersion = ["Major", "Minor", "Patch"]
    .collect { appVersionProps.getProperty("version.version$it") }.join(".") +
    (project.findProperty("version.versionPostfix")?.with { "-$it" } ?: "")

tasks.register("printApiBridgeClientVersion") {
    doLast { println(apiBridgeClientVersion) }
}

// Published to the GitHub Packages registry of the repository that runs the build, by
// .github/workflows/publish-api-bridge-client.yml on an api-bridge-client-v<version> tag.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "io.anytype.apibridge"
                artifactId = "api-bridge-client"
                version = apiBridgeClientVersion
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/${System.getenv("GITHUB_REPOSITORY") ?: "garyp/anytype-kotlin"}")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
